name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install linters and compilers
        run: sudo apt-get update && sudo apt-get install -y shellcheck g++
      - name: Run tests
        run: bash tests/test_cli.sh


  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build development container
        run: |
          docker build -t yocto-devkit:smoke \
            --build-arg "HOST_UID=$(id -u)" \
            --build-arg "HOST_GID=$(id -g)" \
            -f docker/Dockerfile .
      - name: Validate toolchain and user mapping
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            yocto-devkit:smoke bash -c '
              set -eu
              getent passwd "$(id -u)"
              git --version
              g++ --version
              python3 -c "import git, jinja2, pexpect, websockets"
              locale -a | grep -i en_US.utf8
              bash /opt/devkit/container-init.sh help
            '
      - name: Bootstrap Yocto sources and validate recipes
        run: |
          mkdir -p "$RUNNER_TEMP/yocto-devkit-ci"/{sources/layers,build,cache/downloads,cache/sstate,home}
          for step in fetch configure verify; do
            docker run --rm --init --user "$(id -u):$(id -g)" \
              --env HOME=/workspace/home \
              --env LANG=en_US.UTF-8 \
              --env LC_ALL=en_US.UTF-8 \
              --mount "type=bind,source=$RUNNER_TEMP/yocto-devkit-ci,target=/workspace" \
              --mount "type=bind,source=$PWD/layers/meta-devkit,target=/opt/devkit/meta-devkit,readonly" \
              --workdir /workspace \
              --security-opt no-new-privileges --cap-drop ALL \
              yocto-devkit:smoke bash /opt/devkit/container-init.sh "$step"
          done
